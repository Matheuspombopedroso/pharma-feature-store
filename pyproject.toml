[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-feature-store"
version = "0.1.0"
description = "Feast + Redis feature store demo for compounding pharmacies (synthetic data)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matheus Pombo Pedroso" }]
requires-python = ">=3.11"
# Feast is pinned exactly: its registry format and APIs move between minor
# releases, so CI must resolve the same version that was tested locally.
dependencies = [
    "feast[redis]==0.68.0",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=15",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.17.6"]  # ruff pinned: formatter output changes between releases

[project.scripts]
pharma-fs = "pharma_fs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["redis: needs a reachable Redis at REDIS_CONNECTION_STRING (skipped otherwise)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
